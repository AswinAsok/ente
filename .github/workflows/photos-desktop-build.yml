name: Build temporary media privacy AppImage

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    appimage:
        runs-on: ubuntu-22.04-arm
        timeout-minutes: 60
        defaults:
            run:
                working-directory: desktop
        env:
            TARGET_CC: clang
            TARGET_CXX: clang++
            NODE_OPTIONS: --max-old-space-size=8192
            NEXT_TELEMETRY_DISABLED: "1"
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  ref: 129d7d229e638e7a3cac3eb7c13dab1f739c8516

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: |
                      desktop/package-lock.json
                      web/package-lock.json

            - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
              with:
                  workspaces: rust
                  shared-key: tempfix-appimage-arm64

            - name: Install dependencies
              run: npm ci

            - name: Build desktop application
              run: npm run build:ci

            - name: Package AppImage
              run: npm exec -- electron-builder --linux AppImage --arm64 --publish never '-c.artifactName=ente-tempfix-129d7d2-${arch}.${ext}'

            - name: Verify packaged fix
              run: |
                  node <<'NODE'
                  const assert = require("node:assert/strict");
                  const fs = require("node:fs");
                  const asar = require("@electron/asar");
                  const archive = "dist/linux-arm64-unpacked/resources/app.asar";
                  const checks = {
                      "utils/temp": ["ente-${uid}", "0o700", "Unsafe temporary directory"],
                      "utils/stream": ["0o600"],
                      "utils/electron": ["umask 077"],
                      "utils/exec-worker": ["umask 077"],
                      "services/image": ["0o600"],
                      "services/ffmpeg-worker": ["0o700", "0o600"],
                  };
                  for (const [module, expected] of Object.entries(checks)) {
                      const file = `app/main/${module}.js`;
                      const packaged = asar.extractFile(archive, file);
                      assert.deepEqual(packaged, fs.readFileSync(file));
                      for (const text of expected) assert.ok(packaged.toString().includes(text), `${file}: ${text}`);
                  }
                  for (const file of ["vips", "ffmpeg/ffmpeg", "napi/index.linux-arm64-gnu.node"])
                      assert.ok(fs.statSync(`dist/linux-arm64-unpacked/resources/${file}`).size > 0);
                  fs.writeFileSync("dist/BUILD-INFO.json", JSON.stringify({
                      sourceCommit: "129d7d229e638e7a3cac3eb7c13dab1f739c8516",
                      sourcePR: "https://github.com/AswinAsok/ente/pull/3",
                      architecture: "aarch64",
                      packagedFixVerified: true,
                  }, null, 2) + "\n");
                  NODE
                  cd dist
                  sha256sum *.AppImage > SHA256SUMS

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  name: ente-tempfix-129d7d2-linux-aarch64
                  path: |
                      desktop/dist/*.AppImage
                      desktop/dist/SHA256SUMS
                      desktop/dist/BUILD-INFO.json
                  if-no-files-found: error
                  compression-level: 0
                  retention-days: 14
